[project]
name = "jira-agent"
version = "0.2.0"
description = "LLM-driven Jira agent: drive Atlassian Cloud Jira through natural-language requests in a terminal REPL."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "AdvsInAI", email = "273494525+AdvsInAI@users.noreply.github.com"},
]
dependencies = [
    "httpx>=0.28.1",
    # Keep pinned while mcp_server.py uses the SDK's private stdio bridge.
    "mcp==2.0.0",
    "openai>=2.36.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
]

[project.scripts]
jira-agent = "jira_agent.cli:main"
jira-agent-mcp = "jira_agent.mcp_server:main"

[project.urls]
Repository = "https://github.com/AdvsInAI/jira-agent"
Issues = "https://github.com/AdvsInAI/jira-agent/issues"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"
